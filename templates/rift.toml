[settings]
animate = @@rift_animate@@
animation_duration = @@anim@@
animation_fps = 100.0
default_disable = false
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false
hot_reload = true
run_on_start = ["@@home@@/.config/sketchybar/plugins/subscribe-rift.sh"]

[settings.layout]
mode = "@@window_mode@@"
[settings.layout.gaps.outer]
top = @@gap_top@@
left = @@gap_outer@@
right = @@gap_outer@@
bottom = @@gap_bottom@@
[settings.layout.gaps.inner]
horizontal = @@gap_inner@@
vertical = @@gap_inner@@
[settings.ui.menu_bar]
enabled = false
show_empty = false
mode = "active"
display_style = "label"
active_label = "name"
[settings.ui.mission_control]
enabled = false
[settings.gestures]
enabled = false  # no trackpad workspace swipes (all themes)
fingers = 3
skip_empty = false
haptics_enabled = false
[virtual_workspaces]
enabled = true
default_workspace_count = 5
auto_assign_windows = false
preserve_focus_per_workspace = true
workspace_names = @@ws_toml@@
app_rules = [
 { app_id = "com.apple.systempreferences", floating = true },
 { app_id = "com.apple.calculator", floating = true },
 { app_id = "com.apple.ActivityMonitor", floating = true },
 { app_id = "com.parallels.desktop.console", floating = true },
 { app_id = "app.veil.search", manage = false },
 # Ghostty terminals are always tiled; only the drop-down quick terminal (not a standard window) floats
 { app_id = "com.mitchellh.ghostty", ax_subrole = "AXStandardWindow", manage = true, floating = false },
 { title_regex = "^(open|save|save as|export|import|print|choose .*)…?$", floating = true },
 { ax_subrole = "AXDialog", floating = true },
 { ax_subrole = "AXSystemDialog", floating = true }
]
[keys]
"Alt + Z" = "toggle_space_activated"
"Alt + F" = "toggle_fullscreen_within_gaps"
"Alt + V" = "toggle_window_floating"
"Alt + Tab" = "switch_to_last_workspace"
"Alt + Return" = { exec = ["@@home@@/.local/bin/veil", "term"] }
"Alt + Shift + R" = "reload_config"
"Alt + R" = { binding_mode = "resize" }
"Alt + Ctrl + 1" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + 2" = { set_workspace_layout = { mode = "scrolling" } }
"Alt + Ctrl + 3" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + 4" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Left" = { move_focus = "left" }
"Alt + Shift + Left" = { move_node = "left" }
"Alt + Down" = { move_focus = "down" }
"Alt + Shift + Down" = { move_node = "down" }
"Alt + Up" = { move_focus = "up" }
"Alt + Shift + Up" = { move_node = "up" }
"Alt + Right" = { move_focus = "right" }
"Alt + Shift + Right" = { move_node = "right" }
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + Shift + 1" = { move_window_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + Shift + 2" = { move_window_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + Shift + 3" = { move_window_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + Shift + 4" = { move_window_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + Shift + 5" = { move_window_to_workspace = 4 }

# Resize mode (Alt + R): an arrow (or H/J/K/L) grows the focused tile toward that side, Shift pulls
# that side back in, Tab picks another tile; Escape, Return, Alt + R or switching apps leaves it.
# All Alt shortcuts still work. The bar shows RESIZE · ESC.
[binding_modes.resize]
"H" = { resize_window_grow = "left" }
"Shift + H" = { resize_window_shrink = "left" }
"J" = { resize_window_grow = "down" }
"Shift + J" = { resize_window_shrink = "down" }
"K" = { resize_window_grow = "up" }
"Shift + K" = { resize_window_shrink = "up" }
"L" = { resize_window_grow = "right" }
"Shift + L" = { resize_window_shrink = "right" }
"Left" = { resize_window_grow = "left" }
"Shift + Left" = { resize_window_shrink = "left" }
"Down" = { resize_window_grow = "down" }
"Shift + Down" = { resize_window_shrink = "down" }
"Up" = { resize_window_grow = "up" }
"Shift + Up" = { resize_window_shrink = "up" }
"Right" = { resize_window_grow = "right" }
"Shift + Right" = { resize_window_shrink = "right" }
"Equal" = { resize_window_grow = "smart" }
"Minus" = { resize_window_shrink = "smart" }
"Tab" = "next_window"
"Shift + Tab" = "prev_window"
"Escape" = { binding_mode = "default" }
"Return" = { binding_mode = "default" }
"Alt + R" = { binding_mode = "default" }
# every normal Alt shortcut keeps working while resizing (focus, move, workspaces, terminal…)
"Alt + Z" = "toggle_space_activated"
"Alt + F" = "toggle_fullscreen_within_gaps"
"Alt + V" = "toggle_window_floating"
"Alt + Tab" = "switch_to_last_workspace"
"Alt + Return" = { exec = ["@@home@@/.local/bin/veil", "term"] }
"Alt + Shift + R" = "reload_config"
"Alt + Ctrl + 1" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + 2" = { set_workspace_layout = { mode = "scrolling" } }
"Alt + Ctrl + 3" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + 4" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Left" = { move_focus = "left" }
"Alt + Shift + Left" = { move_node = "left" }
"Alt + Down" = { move_focus = "down" }
"Alt + Shift + Down" = { move_node = "down" }
"Alt + Up" = { move_focus = "up" }
"Alt + Shift + Up" = { move_node = "up" }
"Alt + Right" = { move_focus = "right" }
"Alt + Shift + Right" = { move_node = "right" }
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + Shift + 1" = { move_window_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + Shift + 2" = { move_window_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + Shift + 3" = { move_window_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + Shift + 4" = { move_window_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + Shift + 5" = { move_window_to_workspace = 4 }
