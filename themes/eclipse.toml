bright_yellow = "f4f1ea"
bright_blue = "a3afc2"
bright_magenta = "b0aca5"
bright_cyan = "dc6a63"

[strings]
chip_icon = ""
chip_label = "ECLIPSE"
title = "ECLIPSE"
