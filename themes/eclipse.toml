chip_style = "outline"
chip_radius = "0"
ws_style = "dot"
ws_radius = "0"
tags = "CPU MEM NET VOL PWR"
tag_mode = "text"
value_case = "upper"
app_glyph = ""
border_style = "round"
border_width = "3.0"
border_active = "0xffb02a2e"   # deep crimson focus edge (not a text colour, so free of the contrast rule)
border_inactive = "0x24e6e0d6"   # a faint bone hairline so unfocused windows hold their shape on black
