# Berserk, in ink: manga-paper bone on black, steel grey, one crimson accent. Panels with square frames.
name = "Eclipse"
macos_accent = 0
[colors]
bg = "0b0b0c"
bg_dark = "070708"
bg_float = "121214"
surface = "19191c"
ws_active = "2a1214"
border = "26262a"
selection = "2e1a1c"
line = "3a3a40"
comment = "828183"
dim = "9a978f"
fg = "e8e3d8"
white = "ffffff"
cyan = "e05252"
magenta = "8e8a83"
yellow = "e8e3d8"
red = "e0654f"
green = "8f9a80"
blue = "7f8ea6"
bright_red = "ea8a78"
