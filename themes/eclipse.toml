tagline = ""
ws = "I II III IV V"
logo = """E C L I P S E
─────────────
STRUGGLE"""

# Shape, type and layout (see ECOSYSTEMS.md). Values may name colors as %role%.
[style]
l_symbol_size = "40"   # search-field mark height in points
l_scrim = "true"
panel_headers = "rule"  # control panel structure (sketchybarrc): text | rule | space
panel_status = "top"
panel_keys = "trailing"
