# Canonical palette: every hex here appears in the templates. Other themes remap these roles.
name = "Night City"
macos_accent = 6  # pink
[colors]
bg = "090d17"
bg_dark = "070a12"
bg_float = "0e1524"
surface = "151b2d"
ws_active = "182e3d"
border = "26324a"
selection = "26385a"
line = "334563"
comment = "76849c"
dim = "8794ad"
fg = "d9f4ff"
white = "ffffff"
cyan = "00e5ff"
magenta = "ff4fbc"
yellow = "fcee09"
red = "ff5370"
green = "5af7a5"
blue = "57a6ff"
bright_red = "ff7890"
bright_green = "8affbf"
bright_yellow = "fff680"
bright_blue = "93c6ff"
bright_magenta = "ff8ed4"
bright_cyan = "80f3ff"

# Text the templates show for this theme (@@key@@). Other themes override what they need.
[strings]
tagline = "SYSTEM ONLINE"
chip_icon = "NC"
chip_label = "// 2077"
title = "NIGHT CITY"
search_chip = "NC//"
ws = "NET CODE COMMS MEDIA FREE"
logo = """  ╱╱  NIGHT CITY
 ╱╱   ━━━━━━━━━━
 NC   SYSTEM ONLINE"""

# Shape, type and layout (see ECOSYSTEMS.md). Values may name colors as %role%.
[style]
l_symbol_size = "30"   # search-field mark height in points
l_corner = "chamfer"   # launcher outline: round | chamfer (cut corners)
l_scrim = "false"   # dim the screen behind the launcher
panel_headers = "text"  # control panel structure (sketchybarrc): text | rule | space
panel_status = "top"
panel_keys = "column"
panel_first = "windows"
notch_band = "true"   # black behind the notch in every environment: one notch rule, and bar text always sits on an opaque backing
search_symbol = "night-city-emblem"
bar_layout = "islands"
bar_radius = "10"
bar_border = "1"
bar_alpha = "f0"
font_tag = "JetBrainsMono Nerd Font:Bold:12.0"
